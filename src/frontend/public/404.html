<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foam Daddy - Spray Foam Insulation Products & Services</title>
    <script>
      // SPA fallback: redirect 404s to index.html with the original path preserved
      // This allows client-side routing to handle deep links after deployment
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Store the intended path in sessionStorage so the app can restore it
        if (path !== '/') {
          sessionStorage.setItem('redirectPath', path + search + hash);
        }
        
        // Redirect to the root, which will load the main app
        window.location.replace('/' + search + hash);
      })();
    </script>
  </head>
  <body>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;">
      <p>Redirecting...</p>
    </div>
  </body>
</html>
